<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxx Chess - Online Multiplayer</title>
    <!-- Library Catur untuk UI (Chessboard.js) -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #1e1e24; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        #board { width: 100%; max-width: 500px; margin-top: 20px; }
        .header { text-align: center; margin-bottom: 10px; }
        #status { margin-top: 15px; font-size: 18px; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>
    <div class="header">
        <h2>♟️ Taxx Chess Multiplayer</h2>
        <p>Room ID: <span id="roomId" style="color:#fbbf24"></span></p>
    </div>

    <div id="board"></div>
    <div id="status">Menunggu pemain lain...</div>

    <script>
        // Ambil Room ID dari URL (?room=123)
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room');
        document.getElementById('roomId').innerText = room;

        if (!room) {
            document.getElementById('status').innerText = "Error: Room ID tidak ditemukan!";
        }

        const socket = io();
        const game = new Chess();
        let myColor = 'w'; // Default putih
        let board = null;

        // Konek ke room
        socket.emit('joinRoom', room);

        socket.on('playerColor', (color) => {
            myColor = color;
            document.getElementById('status').innerText = color === 'w' ? "Kamu Putih. Giliran kamu!" : "Kamu Hitam. Tunggu lawan...";
        });

        socket.on('gameStart', () => {
            document.getElementById('status').innerText = "Game dimulai!";
        });

        // Init Papan Catur
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: myColor === 'w' ? 'white' : 'black',
            onDrop: handleMove
        });

        // Saat bidak digerakkan
        function handleMove(source, target) {
            // Cek apakah giliran dia
            if (game.turn() !== myColor) {
                return 'snapback';
            }

            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Selalu promosi ke ratu
            });

            if (move === null) return 'snapback';

            // Kirim langkah ke server
            socket.emit('move', { room: room, source, target });
        }

        // Terima langkah dari lawan
        socket.on('opponentMove', (data) => {
            game.move({ from: data.source, to: data.target, promotion: 'q' });
            board.position(game.fen());
            updateStatus();
        });

        function updateStatus() {
            if (game.in_checkmate()) {
                document.getElementById('status').innerText = "SKAKMAT! Game selesai.";
            } else {
                document.getElementById('status').innerText = game.turn() === myColor ? "Giliran kamu!" : "Giliran lawan...";
            }
        }
    </script>
</body>
</html>
